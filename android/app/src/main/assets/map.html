<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选择定位点</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; }
  .pick-dot {
    background: #3B6CF6; border: 3px solid #fff; border-radius: 50%;
    box-shadow: 0 0 8px rgba(0,0,0,.45); box-sizing: border-box;
  }
  .info {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 999;
    background: rgba(255,255,255,.96); padding: 10px 14px 12px;
    font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    box-shadow: 0 -2px 10px rgba(0,0,0,.15);
  }
  .coords { font-size: 16px; font-weight: 700; color: #111; }
  .dist { color: #555; margin-top: 2px; }
  .dist.ok { color: #16A34A; font-weight: 600; }
  .dist.bad { color: #D97706; font-weight: 600; }
  .legend { color: #999; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="info">
  <div class="coords" id="coords">点击地图选择位置</div>
  <div class="dist" id="dist"></div>
  <div class="legend" id="legend">蓝色虚线圈 = 打卡有效范围</div>
</div>
<script src="leaflet.js"></script>
<script>
(function () {
  function num(v, dft) { var n = parseFloat(v); return isNaN(n) ? dft : n; }
  var qs = new URLSearchParams(location.search);
  var lat = num(qs.get('lat'), 30.753818);
  var lng = num(qs.get('lng'), 103.934258);
  var fLat = num(qs.get('flat'), 30.753818);
  var fLng = num(qs.get('flng'), 103.934258);
  var FENCE = num(qs.get('fence'), 150);

  var map = L.map('map').setView([lat, lng], 17);
  // 高德栅格瓦片（GCJ02 对齐：地图上点到的经纬度即为 GCJ02，直接可用）
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: '1234', minZoom: 3, maxZoom: 19, attribution: '高德地图'
  }).addTo(map);

  // 打卡围栏
  L.circle([fLat, fLng], {
    radius: FENCE, color: '#3B6CF6', weight: 1.5, dashArray: '5 5',
    fillColor: '#3B6CF6', fillOpacity: 0.08
  }).addTo(map);

  var marker = L.marker([lat, lng], {
    draggable: true,
    icon: L.divIcon({ className: 'pick-dot', iconSize: [16, 16] })
  }).addTo(map);

  function haversine(a1, o1, a2, o2) {
    var R = 6371000, rad = Math.PI / 180;
    var dA = (a2 - a1) * rad, dO = (o2 - o1) * rad;
    var s = Math.sin(dA / 2) * Math.sin(dA / 2) +
            Math.cos(a1 * rad) * Math.cos(a2 * rad) * Math.sin(dO / 2) * Math.sin(dO / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function fmtDist(m) { return m < 1000 ? Math.round(m) + ' 米' : (m / 1000).toFixed(2) + ' 公里'; }

  function update(la, ln, notify) {
    marker.setLatLng([la, ln]);
    document.getElementById('coords').textContent = la.toFixed(6) + ', ' + ln.toFixed(6);
    var d = haversine(la, ln, fLat, fLng);
    var el = document.getElementById('dist');
    el.textContent = '距打卡点 ' + fmtDist(d) + (d <= FENCE ? ' · 围栏内 ✓' : ' · 围栏外');
    el.className = 'dist ' + (d <= FENCE ? 'ok' : 'bad');
    if (notify && window.Android && Android.onPick) { Android.onPick(la, ln); }
  }

  map.on('click', function (e) { update(e.latlng.lat, e.latlng.lng, true); });
  marker.on('dragend', function () { var p = marker.getLatLng(); update(p.lat, p.lng, true); });

  update(lat, lng, false);

  var legend = document.getElementById('legend');
  if (legend) {
    legend.textContent = '蓝色虚线圈 = 打卡有效范围（半径 ' +
      (FENCE < 1000 ? Math.round(FENCE) + ' 米' : (FENCE / 1000).toFixed(1) + ' 公里') + '）';
  }
})();
</script>
</body>
</html>
